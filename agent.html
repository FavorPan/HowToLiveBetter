<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="index,follow">
<meta name="description" content="对《高性价比人生指南》提问，AI 依据书中条目回答，附条目出处。">
<title>问一问 · 高性价比人生指南</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233451b2'/%3E%3Cpath d='M17 33l10 11 20-24' fill='none' stroke='white' stroke-width='7' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>(function(){try{var s=localStorage.getItem('theme');var d=s?s==='dark':matchMedia('(prefers-color-scheme: dark)').matches;if(d)document.documentElement.classList.add('dark')}catch(e){}})();</script>
<style>
  /* 配色、字体与 index.html / selfcheck.html 同一套（VitePress 默认主题）；
     亮暗跟主页开关走：读 localStorage 的 theme 键，没存过跟系统 */
  :root { --bg:#ffffff; --bg-alt:#f6f6f7; --bg-soft:#f6f6f7; --bg-mute:#f1f1f2; --divider:#e2e2e3;
    --t1:rgba(60,60,67,1); --t2:rgba(60,60,67,.78); --t3:rgba(60,60,67,.56);
    --brand-1:#3451b2; --brand-2:#3a5ccc; --brand-soft:rgba(100,108,255,.14);
    --font:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
    color-scheme:light; }
  html.dark { --bg:#1b1b1f; --bg-alt:#161618; --bg-soft:#202127; --bg-mute:#2b2b2f; --divider:#2e2e32;
    --t1:rgba(255,255,245,.86); --t2:rgba(235,235,245,.6); --t3:rgba(235,235,245,.38);
    --brand-1:#a8b1ff; --brand-2:#5c73e7; --brand-soft:rgba(100,108,255,.16);
    color-scheme:dark; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--t1); font:15px/1.75 var(--font); -webkit-font-smoothing:antialiased; min-height:100vh; display:flex; flex-direction:column; }
  a { color:var(--brand-1); text-decoration:none; }
  a:hover { color:var(--brand-2); }
  button { font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer; }
  :focus-visible { outline:2px solid var(--brand-1); outline-offset:2px; border-radius:4px; }
  /* 页头与 selfcheck.html 同款布局：站名靠左，右侧配额 + 回检索页 */
  .nav { position:sticky; top:0; z-index:10; height:56px; background:var(--bg); border-bottom:1px solid var(--divider); display:flex; align-items:center; gap:12px; padding:0 24px; }
  .nav .title { font-weight:600; font-size:16px; color:var(--t1); }
  .nav .title:hover { color:var(--t1); text-decoration:none; }
  .nav .sp { flex:1; }
  .nav .quota { font-size:13px; color:var(--t3); }
  .nav .back { font-size:14px; font-weight:500; }
  main { flex:1; width:min(760px,100%); margin:0 auto; padding:24px 20px 130px; }
  .bubble { max-width:640px; margin:0 0 16px; padding:12px 16px; border-radius:12px; white-space:pre-wrap; }
  .user { background:var(--brand-1); color:#fff; margin-left:auto; width:fit-content; max-width:80%; }
  html.dark .user { color:#1b1b1f; }
  .bot { background:var(--bg-soft); }
  .bot .note { margin-top:8px; font-size:12px; color:var(--t3); }
  .chips { margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .chip { font-size:13px; color:var(--brand-1); background:var(--bg-mute); border:1px solid var(--divider); border-radius:6px; padding:2px 8px; text-decoration:none; }
  .chip:hover { border-color:var(--brand-1); color:var(--brand-1); text-decoration:none; }
  .sys { text-align:center; color:var(--t3); font-size:13px; margin:8px 0 16px; white-space:normal; }
  footer { position:fixed; bottom:0; left:0; right:0; background:var(--bg); border-top:1px solid var(--divider); padding:10px 20px 14px; }
  .composer { max-width:640px; margin:0 auto; display:flex; gap:8px; align-items:flex-end; }
  textarea { flex:1; resize:none; border:1px solid var(--divider); border-radius:10px; background:var(--bg-alt); color:var(--t1); font:inherit; padding:10px 12px; height:52px; max-height:140px; }
  textarea:focus { outline:0; border-color:var(--brand-1); background:var(--bg); }
  .composer button { border-radius:10px; background:var(--brand-1); color:#fff; padding:10px 16px; transition:background .2s; }
  .composer button:hover { background:var(--brand-2); }
  .composer button:disabled { opacity:.5; cursor:default; }
  .composer button.ghost { background:var(--bg-mute); color:var(--t1); }
  .composer button.ghost:hover { background:var(--divider); }
  html.dark .composer button:not(.ghost) { color:#1b1b1f; }
  .counter { max-width:640px; margin:4px auto 0; font-size:12px; color:var(--t3); text-align:right; }
  /* 思考态气泡：三个圆点跳动，回答到位后这个元素被替换成正式回答 */
  .thinking { display:flex; align-items:center; gap:8px; color:var(--t3); }
  .thinking .dots { display:inline-flex; gap:4px; }
  .thinking .dot { width:6px; height:6px; border-radius:50%; background:var(--t3); animation:blink 1.2s infinite ease-in-out; }
  .thinking .dot:nth-child(2) { animation-delay:.2s; }
  .thinking .dot:nth-child(3) { animation-delay:.4s; }
  @keyframes blink { 0%,80%,100% { opacity:.25; } 40% { opacity:1; } }
  #send { min-width:76px; }
  #send.stop { background:#d93025; color:#fff; } /* 思考中：红底停止键，图标白色两种主题都可读 */
  #send.stop .plane { display:none; }
  #send.stop .stopbox { display:inline-block; }
  #send .sq { display:none; width:12px; height:12px; border-radius:2px; background:currentColor; }
  .icon { width:14px; height:14px; vertical-align:-2px; fill:currentColor; }
</style>
</head>
<body>
<header class="nav">
  <a class="title" href="./">高性价比人生指南</a>
  <span class="sp"></span>
  <span class="quota" id="quota"></span>
  <a class="back" href="./">回检索页</a>
</header>
<main id="thread">
  <div class="sys">问题只从书里找答案，回答附条目出处。这本书没写的问题会直接说没写。</div>
</main>
<footer>
  <div class="composer">
    <textarea id="q" rows="1" maxlength="500" placeholder="比如：被裁员能拿多少补偿？"></textarea>
    <button id="send" title="发送（思考中点击=停止）">
      <svg class="icon plane" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.4 20.4l17.5-8.4c.8-.4.8-1.5 0-1.9L3.4 1.7c-.7-.3-1.4.2-1.4 1v5.6c0 .5.4.9.8 1l11.4 2.2c.4.1.4.6 0 .7L2.8 11.9c-.4.1-.8.5-.8 1v5.6c0 .7.7 1.2 1.4.9z"/></svg>
      <span class="sq stopbox"></span>
    </button>
    <button class="ghost" id="reset" disabled>新对话</button>
  </div>
  <div class="counter"><span id="cnt">0</span>/500</div>
</footer>
<noscript>问答功能需要启用 JavaScript。也可以直接阅读各节内容。</noscript>
<script>
(() => {
  const API = (() => {
    const h = location.hostname;
    if (h === '127.0.0.1' || h === 'localhost') return new URLSearchParams(location.search).get('api') || 'http://127.0.0.1:8787';
    if (h.endsWith('github.io')) return 'https://howtolivebetter.favorhub.top'; // GH Pages 版直连主站 API（Worker CORS 白名单已含 favorpan.github.io）
    return '';
  })();
  const thread = document.getElementById('thread');
  const q = document.getElementById('q');
  const send = document.getElementById('send');
  const cnt = document.getElementById('cnt');
  const quota = document.getElementById('quota');
  const resetBtn = document.getElementById('reset');
  const history = [];
  let busy = false;
  let ctl = null;
  let thinkEl = null; // 思考态气泡：请求结束时替换成正式内容或移除
  let cleared = false; // 忙碌中确认了「新对话」：吞掉随后到来的中止提示

  // 思考态：带三个跳动圆点的 bot 气泡，回答回来原地替换，不闪跳
  function showThinking() {
    const d = document.createElement('div');
    d.className = 'bubble bot thinking';
    const dots = document.createElement('span');
    dots.className = 'dots';
    for (let i = 0; i < 3; i++) {
      const s = document.createElement('span');
      s.className = 'dot';
      dots.appendChild(s);
    }
    d.appendChild(dots);
    d.appendChild(document.createTextNode('正在思考…'));
    thread.appendChild(d);
    touch();
    return d;
  }
  function endThinking() {
    if (thinkEl) { thinkEl.remove(); thinkEl = null; }
  }

  // 忙碌态视觉：发送键变红色停止键（方块图标），新对话按钮停用
  function setBusy(on) {
    busy = on;
    send.classList.toggle('stop', on);
    send.title = on ? '点击停止生成' : '发送';
    send.setAttribute('aria-label', on ? '停止生成' : '发送');
    resetBtn.disabled = on || !hasTalk();
    send.disabled = false; // 忙碌时它就是停止键，必须可点
  }

  const setQuota = r => { if (r && typeof r.remaining === 'number') quota.textContent = '今天还能问 ' + r.remaining + ' 次'; };
  const refreshQuota = () => fetch(API + '/api/qa/quota').then(r => r.ok ? r.json() : null).then(setQuota).catch(() => {});

  const hasTalk = () => thread.querySelectorAll('.bubble').length > 0;
  function touch() {
    resetBtn.disabled = !hasTalk();
    const last = thread.lastElementChild;
    if (last) last.scrollIntoView({ block: 'end' });
  }

  function add(cls, text) {
    const d = document.createElement('div');
    d.className = 'bubble ' + cls;
    d.textContent = text;
    thread.appendChild(d);
    touch();
    return d;
  }

  function addAnswer(text, cites) {
    const d = document.createElement('div');
    d.className = 'bubble bot';
    const body = document.createElement('div');
    body.textContent = text;
    d.appendChild(body);
    if (cites && cites.length) {
      const box = document.createElement('div');
      box.className = 'chips';
      for (const c of cites) {
        const a = document.createElement('a');
        a.className = 'chip';
        a.href = './#e-' + c.sec + '-' + c.num;
        a.textContent = '第 ' + c.sec + ' 节 · ' + c.title;
        box.appendChild(a);
      }
      d.appendChild(box);
    }
    const note = document.createElement('div');
    note.className = 'note';
    note.textContent = 'AI 摘要，以书目原文为准。'; // 固定免责行，有引用没引用都显示
    d.appendChild(note);
    thread.appendChild(d);
    touch();
  }

  async function ask() {
    const question = q.value.trim();
    if (!question || busy) return;
    q.value = '';
    cnt.textContent = '0';
    add('user', question);
    thinkEl = showThinking();
    setBusy(true);
    ctl = new AbortController();
    try {
      const res = await fetch(API + '/api/qa/ask', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ question, history: history.slice(-3) }), // 与服务端 MAX_HISTORY=3 对齐，正文上限将来调大也不会失守
        signal: ctl.signal,
      });
      let j = null;
      try { j = await res.json(); } catch (e) {}
      endThinking(); // 思考气泡先移除，正式回答接在原位
      const msg = (j && typeof j.message === 'string' && j.message) || '出了点问题，稍后再试。';
      if (res.status === 429) {
        add('sys', (j && typeof j.message === 'string' && j.message) || '今天在这个网络的免费次数用完了，明天早上 8 点后再来。');
        // 只有日配额用完才把显示清零；并发 429（reason=concurrent）时次数其实还在，
        // 清零会让双开标签页的读者误以为「还能问 0 次」（终审 M3）。
        const reason = j && j.reason;
        const isDaily = reason === 'daily' || (reason === undefined && /次数用完了/.test(msg));
        if (isDaily) setQuota({ remaining: 0 });
      } else if (j && j.type === 'answer') {
        addAnswer(j.answer, j.cites);
        setQuota({ remaining: j.remaining });
        history.push({ q: question, a: String(j.answer).slice(0, 300) });
      } else if (j && (j.type === 'no_hit' || j.type === 'fail')) {
        add('sys', msg);
      } else {
        add('sys', msg);
      }
    } catch (e) {
      endThinking();
      if (e.name === 'AbortError') {
        // 忙碌中确认过「新对话」的，气泡已清空，不再补一条停止提示
        if (!cleared) add('sys', '已停止生成。');
        cleared = false;
      } else {
        add('sys', '网络出了问题，稍后再试。');
      }
    } finally {
      ctl = null;
      setBusy(false);
    }
  }

  // 发送键双职责：空闲时发送，思考中是红色停止键
  send.onclick = () => { if (busy) { if (ctl) ctl.abort(); } else ask(); };
  resetBtn.onclick = () => {
    if (busy) {
      if (!confirm('正在生成中，停止并清空当前对话？')) return;
      cleared = true; // 吞掉中止后本会出现的「已停止生成。」
      if (ctl) ctl.abort();
    } else if (!hasTalk() || !confirm('清空当前对话，开始新对话？')) {
      return;
    }
    thread.querySelectorAll('.bubble').forEach(b => b.remove());
    history.length = 0;
    endThinking();
    touch();
    refreshQuota();
  };
  q.onkeydown = e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); } };
  q.oninput = () => { cnt.textContent = String(q.value.length); };
  refreshQuota();
})();
</script>
</body>
</html>
