# 每 10 分钟从上游同步一次（GitHub 定时任务最细 5 分钟，高峰期调度可能延迟）。
# main 保持与上游一致（只多本 workflow 文件，路径上游不会用，merge 永不冲突）；
# pages-deploy 为自动生成的部署分支：替换站点域名为本 fork 的 Pages 地址后强推，
# GitHub Pages（legacy，源分支 pages-deploy）会在推送后自动重新构建发布。
# cloudflare-deploy 同理：替换站点域名为 howtolivebetter.favorhub.top、仓库和
# README 链接为本 fork 的，并摘除 GA 统计、广告位和赞赏码（连同弹窗 JS/CSS 与
# ads/ 目录、tools/ 下广告源文件，残留校验不过就失败），由 Cloudflare Pages
# 连接该分支自动发布；issue、Star History 等指向上游出处的链接保留不动。
# 「电子书」workflow（book.yml）不会因同步的 push 触发（GITHUB_TOKEN 的 push
# 不触发其他 workflow，GitHub 防递归），本 workflow 在 main 有内容变化时手动
# dispatch 一次，保持 Release 电子书最新。
name: Sync upstream

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_ebook:
        description: "无内容变化也强制重建电子书 Release（调试用）"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-upstream
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream/main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/eternity4719/HowToLiveBetter.git
          git fetch upstream main
          before=$(git rev-parse HEAD)
          git merge upstream/main --no-edit
          git push origin main
          if [ "$(git rev-parse HEAD)" != "$before" ]; then
            echo "MAIN_CHANGED=true" >> "$GITHUB_ENV"
          fi

      # 内容没变就不提交不推送。原写法 git diff --cached 比较的是改写结果对 main，
      # 而改写结果对 main 永远有差异，定时任务会每 10 分钟强推一个同内容提交；
      # 改成比较改写后 tree 的哈希，跟远端分支一致就跳过。
      - name: Build pages-deploy branch
        run: |
          git checkout -B pages-deploy main
          grep -rl 'eternity4719\.github\.io/HowToLiveBetter' \
            --exclude-dir=.git \
            --include='*.html' --include='*.xml' --include='*.txt' --include='*.md' . \
            | xargs -r perl -pi -e 's{https://eternity4719\.github\.io/HowToLiveBetter}{https://favorpan.github.io/HowToLiveBetter}g'
          git add -A
          tree=$(git write-tree)
          remote=$(git rev-parse --verify 'origin/pages-deploy^{tree}' 2>/dev/null || echo none)
          if [ "$tree" = "$remote" ]; then
            echo "站点文件无变化，跳过推送"
          else
            git commit -m "chore: rewrite site URLs for fork Pages deploy [skip ci]"
            git push origin pages-deploy --force
          fi

      # 同上，但目标是 Cloudflare Pages：站点域名、GitHub 仓库和 README 链接都
      # 改到本 fork；issue、Star History 等上游出处保留。扫描用宽词 eternity4719
      # （github.io 域名里没有紧跟斜杠，窄词选不中 sitemap.xml 和 robots.txt），
      # 不放心的改写都做了护栏：issues/pull/commit/discussions 不改，.yml 和
      # LICENSE、构建脚本不在扫描范围。
      # 另外摘除 GA 统计、广告位和赞赏码，并校验残留：GA 片段自带 ga:start/ga:end
      # 剥离标记（离线构建同款）；广告图和赞赏按钮同在一个 div 里一起删；赞赏弹窗
      # 的 HTML、CSS、JS 三处一起摘，只删 HTML 的话弹窗 JS 会对 null 加监听抛错、
      # 中断整个初始化脚本。README 从「## 赞赏」标题删到文件尾（赞赏和广告位是
      # 最后两节）。ads/ 目录和 tools/ 下的广告源文件一并移除。
      - name: Build cloudflare-deploy branch
        run: |
          git checkout -B cloudflare-deploy main
          grep -rl 'eternity4719' \
            --exclude-dir=.git \
            --include='*.html' --include='*.xml' --include='*.txt' --include='*.md' . \
            | xargs -r perl -pi -e 's{https://eternity4719\.github\.io/HowToLiveBetter}{https://howtolivebetter.favorhub.top}g; s{raw\.githubusercontent\.com/eternity4719/HowToLiveBetter}{raw.githubusercontent.com/FavorPan/HowToLiveBetter}g; s{github\.com/eternity4719/HowToLiveBetter(?!/(?:issues|pull|commit|discussions))}{github.com/FavorPan/HowToLiveBetter}g'
          perl -0777 -pi -e 's,<!-- ga:start.*?<!-- ga:end -->\n?,,s; s,\s*<div class="group ad">.*?</div>\s*</aside>,\n</aside>,s; s,/\* 赞赏：侧栏底部一行字.*?#tip-box button:hover\{.*?\}\n,,s; s,\s*<div id="tip-mask" hidden>.*?</div>\s*(<div id="xref-pop"),$1,s; s,/\* ---------- 赞赏码弹窗 ---------- \*/.*?\n(\(async function init\(\)\{),$1,s' index.html
          perl -0777 -pi -e 's,\n## 赞赏[\s\S]*$,,s' README.md
          rm -rf ads tools/ad-mcyyy.html tools/ad-mcyyy-side.html tools/ad-mcyyy-bg.webp
          if grep -n 'googletagmanager\|mcyyy\|wechat-reward\|赞赏\|tip-open\|tip-mask\|tip-box\|group ad' index.html README.md; then
            echo '统计、广告或赞赏清除不彻底，拒绝发布' >&2
            exit 1
          fi
          git add -A
          tree=$(git write-tree)
          remote=$(git rev-parse --verify 'origin/cloudflare-deploy^{tree}' 2>/dev/null || echo none)
          if [ "$tree" = "$remote" ]; then
            echo "站点文件无变化，跳过推送"
          else
            git commit -m "chore: rewrite site URLs for Cloudflare deploy [skip ci]"
            git push origin cloudflare-deploy --force
          fi

      # push 用的是 GITHUB_TOKEN，GitHub 不会让它再触发其他 workflow，
      # 所以 main 有内容变化时在这里手动补一次，电子书 Release 才会更新。
      # gh 在 fork 仓库里默认解析到上游父仓库，必须显式 --repo 指回本仓库
      - name: Rebuild ebook release
        if: env.MAIN_CHANGED == 'true' || inputs.force_ebook == true
        run: gh workflow run book.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          GH_TOKEN: ${{ github.token }}

      # 仓库 60 天无活动 GitHub 会自动停用定时任务，临近时自动补一个空提交保活
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct origin/main)
          now=$(date +%s)
          age=$(( (now - last) / 86400 ))
          if [ "$age" -ge 50 ]; then
            git commit --allow-empty -m "chore: keepalive（空提交保活定时任务）"
            git push origin main
          else
            echo "最近一次提交距今 ${age} 天，无需保活"
          fi
